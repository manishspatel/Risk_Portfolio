<title>EHS Risk Portfolio</title>
<style>
:root{--ink:#1d2b36;--mut:#5d6b76;--bg:#f6f7f4;--card:#fff;--line:#d9ded9;--acc:#0f5c6e}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--ink);color:#fff;padding:14px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
header h1{font-size:18px;margin:0}
main{max-width:1100px;margin:0 auto;padding:16px}
button{font:inherit;padding:6px 12px;border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:4px;cursor:pointer}
button.o{background:#fff;color:var(--acc)}button.x{background:#fff;color:#b3261e;border-color:#b3261e}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #f2b705;outline-offset:1px}
#sel{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:14px}
label.f{display:flex;flex-direction:column;font-weight:600;gap:4px}
select,input[type=text],input[type=date],input[type=number],textarea{font:inherit;padding:6px;border:1px solid var(--line);border-radius:4px;width:100%}
#tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
#tabs button{background:#fff;color:var(--ink);border-color:var(--line)}#tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);padding:14px;margin-bottom:14px;border-radius:4px}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid var(--line);padding:7px;text-align:left;vertical-align:top}
.b{display:inline-block;padding:2px 8px;border-radius:3px;color:#fff;font-weight:600;font-size:13px;white-space:nowrap}
.ck{display:flex;gap:8px;padding:4px 0;align-items:flex-start}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.hm td,.hm th{text-align:center;height:62px;width:16%;font-size:13px;color:#fff;font-weight:600;border:2px solid var(--bg)}
.hm th{color:var(--ink);height:auto;background:none}
.mut{color:var(--mut)}.empty{padding:30px;text-align:center;color:var(--mut)}
</style>
</head>

liquid radioactive waste","Leak-proof, labeled transport containers meeting ADR/IAEA standards","Waste storage rooms with radiation monitoring and access control","Waste inventory records and manifests for traceability","Disposal only through authorized agencies and approved routes","Supervision by certified Radiation Safety Officer (RSO)","Periodic audits and readiness for regulatory inspections"]},{"id":"A22","name":"Handling of Active Biological Materials (Cell Cultures, RNA/DNA Cultures, etc.)","sc":["Contamination of laboratory environment or personnel","Infection risk from accidental exposure","Improper disposal causing community/public health hazards","Cross-contamination affecting research quality"],"co":["Laboratory-acquired infections (LAIs)","Shutdown of facilities for decontamination","Loss of experimental data and resources","Regulatory penalties for biosafety breaches"],"ct":["Class II or III biosafety cabinets (BSCs) with validated HEPA filtration","Autoclaves for waste decontamination","HEPA-filtered exhaust systems for containment zones","Hands-free sinks and touchless waste disposal bins","Biosafety training (BSL-2/BSL-3 as applicable)","Use of PPE (gloves, goggles, lab coats) at all times","Proper labeling and segregation of cultures","Incident reporting and post-exposure response protocols"]},{"id":"A23","name":"Handling of Biomedical Waste (@ Source and @Central Waste Yard)","sc":["Exposure to infectious or biohazardous materials","Needle-stick injuries or cuts from sharps","Fire risk from flammable biomedical waste","Environmental pollution from improper disposal"],"co":["Disease transmission (HIV, HBV, HCV, etc.)","Regulatory action under BMW Management Rules","Community exposure to pathogens","Fire or explosion incidents in waste yards"],"ct":["Color-coded, leak-proof waste containers per biomedical waste rules","Needle destroyers and puncture-proof sharps bins","Segregated, ventilated central waste storage yards","Autoclaving or incineration systems for waste treatment","Biomedical waste handling and segregation training","Daily waste transfer logs and record keeping","Mandatory PPE usage (gloves, masks, aprons)","Disposal only via authorized biomedical waste agencies"]},{"id":"A24","name":"Operation of Pressure Vessels (Reactors, Fermentors, Air Receivers, Cryo Bullets, Autoclaves)","sc":["Catastrophic rupture from overpressure or corrosion","Scalding from steam or hot liquid discharge","Cryogenic burns from liquid nitrogen/oxygen exposure","Toxic or flammable gas release from vessel contents"],"co":["Multiple fatalities and severe injuries","Significant property and equipment damage","Extended production downtime","Regulatory non-compliance penalties"],"ct":["Pressure relief valves and rupture discs sized per ASME code","Interlocks for pressure/temperature limits","Thermal insulation and vessel jackets for hot/cold surfaces","Periodic thickness testing and NDT inspections","Operator certification and logbook maintenance","SOPs for startup, operation, and shutdown","Statutory inspection and certification schedule adherence","Emergency drills for vessel-related incidents"]},{"id":"A25","name":"Operation of Deep Freezer","sc":["Cold burns or frostbite from direct skin contact","Temperature excursions affecting sample integrity","Asphyxiation risk from LN₂/O₂ displacement in enclosed spaces","Electrical fire from freezer faults"],"co":["Sample loss and research disruption","Worker injuries from cold burns or hypoxia","Lab downtime and replacement cost of equipment","Fire hazards affecting nearby equipment"],"ct":["Temperature alarms with auto-shutdown features","Adequate ventilation in storage area","Insulated gloves and face shields for handling frozen materials","GFCI-protected electrical connections","Freezer monitoring logs with deviation action plans","PPE usage training","SOPs for safe loading/unloading","Inventory control and labeling for stored samples"]},{"id":"A26","name":"Installing, Maintenance and Operation of BioSafety Cabinets","sc":["Release of infectious aerosols during HEPA filter failure","Operator exposure from inadequate airflow","Cross-contamination between samples","Electric shock during servicing"],"co":["Lab-acquired infections","Loss of sample integrity and contamination events","Regulatory action for biosafety breaches","Equipment damage and downtime"],"ct":["Certified Class II/III BSCs with HEPA filters","Airflow disruption alarms","Proper ducting and exhaust systems","Electrical interlocks and proper grounding","Regular filter integrity testing and airflow validation","SOPs for BSC decontamination and safe operation","Maintenance records and service logs","Aseptic technique training for operators"]},{"id":"A27","name":"Operation of Sonicator, Lyophilizer","sc":["Hearing loss from high-frequency noise (sonicator)","Implosion or explosion from vacuum system failure (lyophilizer)","Sample spillage and contamination","Burns from hot surfaces or cryogen exposure"],"co":["Permanent hearing damage","Sample/product loss and downtime","Worker injury from thermal or pressure hazards","Laboratory contamination"],"ct":["Soundproof enclosure or isolation area for sonicator","Vacuum interlocks and burst discs for lyophilizer","Spill containment sample holders","Thermal insulation of hot/cold zones","Equipment-specific training and safe handling SOPs","PPE use including hearing protection","Routine preventive maintenance and inspection","Warning signage during operation"]},{"id":"A28","name":"Transfer of Chemicals from Stores, Warehouse to Labs or Production Floor","sc":["Spillage or leakage during transfer","Inhalation of toxic vapors or corrosive contact","Fire or explosion from static discharge (flammables)","Misdelivery due to labeling errors"],"co":["Worker injury from exposure or burns","Fire/explosion incidents in corridors or elevators","Contamination of other chemicals or areas","Production delays from incorrect chemical supply"],"ct":["Sealed, labeled containers and spill-containment carts","Antistatic wheels and grounding straps","Ventilated transfer corridors","Secondary containment trays","SOPs for chemical transfer and labeling checks","Transport logs and verification protocols","Spill response training and PPE use","Restricted routes and time windows for movement"]},{"id":"A29","name":"Operation of Equipment like Centrifuge, Agitated Nutsche Filter, RCVD, Spray Drier, Sparkler Filter, Air Jet Mill","sc":["Mechanical failure (rotor burst, implosion)","Exposure to hazardous dusts, vapors, or solvents","Burns from hot surfaces or compressed gases","Fire/explosion from combustible powders or solvent vapors"],"co":["Severe injury from shrapnel or high-speed parts","Respiratory issues from airborne particulates","Facility damage from fires/explosions","Regulatory breaches for dust/vapor emissions"],"ct":["Safety interlocks and emergency shut-offs","Explosion-proof motors and enclosures","Enclosed systems with local exhaust ventilation (LEV)","Overpressure relief valves and temperature controls","Equipment-specific training and certification","SOPs for safe startup, operation, and shutdown","Preventive maintenance schedule adherence","PPE for heat, pressure, and chemical exposure"]},{"id":"A30","name":"Testing, Transferring, Euthanization of Laboratory Animals","sc":["Animal bites or scratches","Exposure to allergens, pathogens, or zoonotic diseases","Emotional stress to personnel handling animals","Biohazard contamination from animal waste or carcasses"],"co":["Occupational illness or injury","Allergic reactions and respiratory distress","Emotional fatigue or compassion stress in staff","Regulatory citations for animal welfare violations"],"ct":["Ventilated animal transfer cabinets","Controlled environment housing (IAF-compliant)","Anesthetic/euthanasia chambers with scavenging systems","Enclosed sharps and waste disposal units","Animal handling and ethics training","SOPs for transfer, testing, and humane euthanasia","Biohazard and allergen exposure protocols","Daily health checks and incident documentation"]},{"id":"A31","name":"Extraction, Preparation of Study Samples from Test Animals","sc":["Exposure to biological fluids and zoonotic diseases","Sharps injury during dissection or sampling","Cross-contamination of samples","Inhalation of anesthetic agents or fixatives"],"co":["Occupational illness or zoonotic infection","Puncture wounds or lacerations","Compromised sample integrity","Respiratory irritation or toxicity from chemicals"],"ct":["Biosafety cabinets for sample preparation","Ventilated sampling rooms","Closed sharps disposal systems","Fume hoods for anesthetic or fixative use","SOPs for aseptic sample handling","Animal ethics and biosafety training","Proper labeling and sample tracking","Mandatory PPE use (gloves, goggles, masks)"]},{"id":"A32","name":"Handling of Carcinogens, Mutagens, Reprotoxic Chemicals","sc":["Chronic exposure causing cancer, genetic defects, or reproductive harm","Inhalation, skin absorption, or ingestion of hazardous substances","Contamination of the work environment","Improper disposal leading to secondary exposure"],"co":["Long-term health effects including cancer or reproductive harm","Acute poisoning or chemical burns","Regulatory non-compliance","Environmental contamination"],"ct":["Ventilated fume hoods or glove boxes","Closed transfer systems","Spill containment kits with neutralizers","HEPA/charcoal filtration in air handling systems","Designated CMR (Carcinogen, Mutagen, Reprotoxic) handling zones","Hazard-specific training programs","Strict PPE protocols (double gloves, lab coats)","Documentation of chemical usage and disposal"]},{"id":"A33","name":"Handling of Glassware","sc":["Cuts or punctures from broken glass","Implosion under vacuum or explosion from pressure","Chemical exposure from broken containers","Slips/trips from dropped items"],"co":["Lacerations or puncture wounds","Eye or face injuries from shattering","Chemical burns or poisoning","Workplace accidents causing secondary injuries"],"ct":["Use of borosilicate/lab-grade glassware","Protective baskets and trolleys for transport","Pressure-rated flasks and vacuum traps","Glass disposal boxes with soft bedding","SOP for glass handling and cleaning","Training on glassware under pressure/vacuum","PPE (gloves, goggles) usage","Inspection and disposal of damaged glassware"]},{"id":"A34","name":"Operation of High Energy Electrical Panels","sc":["Arc flash or electrical burns","Electrocution from live contact","Short circuits leading to fires","Damage from improper isolation"],"co":["Severe burns or fatal injury","Fire and property damage","Power outages affecting operations","Equipment damage"],"ct":["Arc-resistant switchgear","Insulation barriers and interlocks","Infrared temperature monitoring systems","Emergency disconnect switches","Electrical work permits and LOTO procedures","Restricted access to authorized personnel","Arc flash PPE and insulated tools","Routine inspection and thermal audits"]},{"id":"A35","name":"Operation of Electrical Substation","sc":["Arc flash, electrical fire, or blast","Exposure to high voltage resulting in fatality","Equipment failure due to poor maintenance","Unintentional energization"],"co":["Severe injury or death","Large-scale fire or explosion","Prolonged power outage","Regulatory penalties"],"ct":["Remote operation panels and interlocks","Protective relays and fault indicators","Oil/air/gas circuit breakers","Ground fault and surge protection systems","Substation entry restricted to qualified personnel","Permit-to-work and LOTO for switching","HV-rated PPE and insulated mats","Periodic equipment testing and calibration"]},{"id":"A36","name":"Dispensing of Chemicals (Flammables, Combustibles) to Laboratory Requirements","sc":["Fire or explosion from vapors or static","Overexposure via inhalation or skin contact","Spillage or mislabeling of chemicals","Dispensing incompatible chemicals"],"co":["Burns, injury, or fatality","Acute or chronic health effects","Environmental contamination","Regulatory non-compliance"],"ct":["Flameproof dispensing stations","Antistatic mats and bonding wires","Local exhaust ventilation systems","Safety cans or closed dispensing systems","Training on chemical compatibility and MSDS use","Dispensing logbooks and labeling SOPs","PPE enforcement in dispensing zones","Restricted access during dispensing"]},{"id":"A37","name":"Disposal and Storage of Spent Chemicals (Solvents, Catalysts, Hazardous Residuals, etc.)","sc":["Fire or toxic release from incompatible waste mixing","Environmental pollution due to leakage","Hazardous accumulation in storage areas","Worker exposure during handling"],"co":["Injury or fatality from fire/explosion","Long-term environmental harm","Regulatory violations","Acute or chronic health effects"],"ct":["Segregated, vented storage in chemical-resistant containers","Secondary containment and flame arrestors","Explosion-proof storage cabinets","Spill control kits","Waste classification and labeling protocols","Regular disposal via authorized agencies","Training on hazardous waste management","Inventory tracking and audit logs"]},{"id":"A38","name":"Storage, Handling and Transport of Corrosive and Toxic Chemicals","sc":["Chemical burns or poisoning from contact or inhalation","Container rupture or leaks causing spills","Incompatible reactions causing fire, toxic gas, or explosion","Environmental contamination from improper handling","Vapor accumulation in enclosed spaces","Exposure during manual transfer"],"co":["Severe injury or fatality","Acute or chronic poisoning","Fire, explosion or toxic release","Environmental harm and regulatory breaches"],"ct":["Corrosion-resistant, sealed, and labeled containers","Ventilated, segregated, bunded storage with spill containment","Gas detection and local exhaust ventilation (LEV)","Secondary containment during transport","Emergency shower and eyewash stations nearby","Auto-closing safety valves for transfer lines","SDS access and training","Chemical compatibility matrix for storage/transfer","SOPs for handling, labeling, and PPE use","Emergency drills and spill response kits","Transport documentation and route control","Periodic inspection of containers and storage areas"]}]};</script>
<script>
// ---- Risk matrix: score = severity digit + frequency letter ----
const LV={};
[["Intolerable","#c62828","Mitigate","1A 1B 1C 2A 2B 3A"],["Undesired","#e08a00","Mitigate","1D 2C 3B 4A"],
 ["Reduced","#1565c0","OFIs or Accepted","1E 2D 3C 3D 4B 4C 5A"],["Tolerable","#2e7d32","Accepted","2E 3E 4D 4E 5B 5C 5D 5E"]]
 .forEach(([n,c,s,l])=>l.split(" ").forEach(k=>LV[k]={n,c,s}));
const KEY="ehsRisk", $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S=JSON.parse(localStorage.getItem(KEY)||"null")||{loc:"",site:"",dept:"",items:{}};
let tab="act", cur=null;
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const it=id=>S.items[id]||(S.items[id]={app:false,sc:[],co:[],ct:[],sev:"",frq:"",tsev:"",tfrq:"",strat:"",act:[],rem:""});
const lvl=(s,f)=>LV[s+f];
const badge=(s,f)=>{const l=lvl(s,f);return l?`<span class="b" style="background:${l.c}">${s}${f} ${l.n}</span>`:'<span class="mut">not rated</span>'};
const uniq=a=>[...new Set(a)];
const keep=fn=>{const y=scrollY;fn();scrollTo(0,y)};

// ---- Location > Site > Department ----
const opts=(list,v)=>'<option value="">Select...</option>'+list.map(x=>`<option${x==v?" selected":""}>${esc(x)}</option>`).join("");
function renderSel(){
  const locs=uniq(D.sites.map(r=>r[0])), sites=uniq(D.sites.filter(r=>r[0]==S.loc).map(r=>r[1])),
        depts=D.sites.filter(r=>r[0]==S.loc&&r[1]==S.site).map(r=>r[2]);
  const f=(k,t,l)=>`<label class="f">${t}<select onchange="setSel('${k}',this.value)">${opts(l,S[k])}</select></label>`;
  $("sel").innerHTML=f("loc","Location",locs)+f("site","Site",sites)+f("dept","OU / Function",depts);
}
function setSel(k,v){S[k]=v;if(k=="loc"){S.site="";S.dept=""}if(k=="site")S.dept="";save();renderSel();render()}

// ---- Tabs ----
function renderTabs(){
  $("tabs").innerHTML=[["act","Activities"],["heat","Heatmaps"],["sum","Summary"]]
   .map(([k,t])=>`<button class="${tab==k&&!cur?"on":""}" onclick="tab='${k}';cur=null;render()">${t}</button>`).join("");
}
function render(){
  renderTabs();
  if(!S.dept){$("view").innerHTML='<div class="card empty">Choose a location, site and OU / function to begin.</div>';return}
  $("view").innerHTML=cur?detail():tab=="act"?list():tab=="heat"?heatView():summary();
}

// ---- Activity list ----
function list(){
  const rows=D.acts.map(a=>{const m=it(a.id);return `<tr><td>${a.id}</td><td>${esc(a.name)}</td>
   <td><input type="checkbox" aria-label="Applicable" ${m.app?"checked":""} onchange="setApp('${a.id}',this.checked)"></td>
   <td>${m.app?badge(m.sev,m.frq):""}</td><td>${m.app?`<button onclick="cur='${a.id}';render();scrollTo(0,0)">Assess</button>`:""}</td></tr>`}).join("");
  const n=D.acts.filter(a=>it(a.id).app).length;
  return `<div class="card"><p class="mut">Tick the activities that apply to this OU. ${n} of ${D.acts.length} selected.</p>
   <div class="wrap"><table><tr><th>No.</th><th>Activity or operation</th><th>Applies</th><th>Current risk</th><th></th></tr>${rows}</table></div></div>`;
}
function setApp(id,v){it(id).app=v;save();keep(render)}

// ---- Assessment form for one activity ----
function detail(){
  const a=D.acts.find(x=>x.id==cur), m=it(cur);
  const chk=(k,arr)=>arr.length?arr.map((t,i)=>`<label class="ck"><input type="checkbox" ${m[k].includes(i)?"checked":""} onchange="tog('${k}',${i})"><span>${esc(t)}</span></label>`).join(""):'<p class="mut">No standard list. Use the remarks box.</p>';
  const pick=(f,v,list)=>`<select onchange="setF('${f}',this.value)">${opts(list,v)}</select>`;
  const sevs=["1","2","3","4","5"], frqs=["A","B","C","D","E"];
  const l=lvl(m.sev,m.frq), tl=lvl(m.tsev,m.tfrq);
  const strat=!l?"":l.n=="Reduced"?`<select onchange="setF('strat',this.value)">${opts(["OFIs","Accepted"],m.strat)}</select>`:l.s;
  const acts=m.act.map((x,i)=>`<tr><td><input type="text" value="${esc(x.t)}" oninput="act(${i},'t',this.value)"></td>
    <td><input type="text" value="${esc(x.o)}" oninput="act(${i},'o',this.value)"></td>
    <td><input type="date" value="${x.d}" oninput="act(${i},'d',this.value)"></td>
    <td><input type="number" min="0" step="0.1" value="${x.b}" oninput="act(${i},'b',this.value)"></td>
    <td><button class="x" onclick="delAct(${i})">Remove</button></td></tr>`).join("");
  return `<button class="o" onclick="cur=null;render()">Back to activities</button>
  <h2>${a.id}: ${esc(a.name)}</h2>
  <div class="two"><div class="card"><h3>Probable risk scenarios</h3>${chk("sc",a.sc)}</div>
   <div class="card"><h3>Probable consequences</h3>${chk("co",a.co)}</div></div>
  <div class="card"><h3>Controls already in place</h3>${chk("ct",a.ct)}
   <p><b>${a.ct.length-m.ct.length}</b> standard controls are not selected. These count as opportunities for improvement (OFIs).</p></div>
  <div class="two"><div class="card"><h3>Current risk</h3>
   <label class="f">Severity (1 = worst)${pick("sev",m.sev,sevs)}</label><br><label class="f">Frequency (A = most often)${pick("frq",m.frq,frqs)}</label>
   <p>${badge(m.sev,m.frq)}</p><p>Strategy: <b>${strat||"-"}</b></p></div>
   <div class="card"><h3>Target risk after actions</h3>
   <label class="f">Severity${pick("tsev",m.tsev,sevs)}</label><br><label class="f">Frequency${pick("tfrq",m.tfrq,frqs)}</label>
   <p>${badge(m.tsev,m.tfrq)}</p></div></div>
  <div class="card"><h3>Action items</h3><div class="wrap"><table><tr><th>Action</th><th>Owner</th><th>Target date</th><th>Budget (INR lakh)</th><th></th></tr>${acts}</table></div>
   <p><button onclick="addAct()">Add action</button></p></div>
  <div class="card"><label class="f">Remarks (any extra controls in place)<textarea rows="3" oninput="setF('rem',this.value,1)">${esc(m.rem)}</textarea></label></div>`;
}
function tog(k,i){const a=it(cur)[k],p=a.indexOf(i);p<0?a.push(i):a.splice(p,1);save();keep(render)}
function setF(f,v,quiet){it(cur)[f]=v;save();if(!quiet)keep(render)}
function addAct(){it(cur).act.push({t:"",o:"",d:"",b:0});save();keep(render)}
function delAct(i){it(cur).act.splice(i,1);save();keep(render)}
function act(i,k,v){it(cur).act[i][k]=v;save()}

// ---- Heatmaps ----
function heat(cur_){
  const cells={};
  D.acts.forEach(a=>{const m=S.items[a.id];if(!m||!m.app)return;const s=cur_?m.sev:m.tsev,f=cur_?m.frq:m.tfrq;if(s&&f)(cells[s+f]=cells[s+f]||[]).push(a.id)});
  let h='<table class="hm"><tr><th>Freq.</th>'+[5,4,3,2,1].map(s=>`<th>Sev ${s}</th>`).join("")+"</tr>";
  "ABCDE".split("").forEach(f=>{h+=`<tr><th>${f}</th>`+[5,4,3,2,1].map(s=>`<td style="background:${LV[s+f].c}">${(cells[s+f]||[]).join(", ")}</td>`).join("")+"</tr>"});
  return h+"</table>";
}
const heatView=()=>`<div class="two"><div class="card"><h3>Current risk profile</h3>${heat(1)}</div><div class="card"><h3>Proposed risk profile</h3>${heat(0)}</div></div>
 <p class="mut">Numbers in each box are activity numbers. Colours: red intolerable, amber undesired, blue reduced, green tolerable.</p>`;

// ---- Summary ----
function rowData(a){const m=it(a.id),l=lvl(m.sev,m.frq),tl=lvl(m.tsev,m.tfrq);
  return {id:a.id,name:a.name,cur:l?m.sev+m.frq:"",curL:l?l.n:"",strat:l?(l.n=="Reduced"?m.strat:l.s):"",ofi:a.ct.length-m.ct.length,
   n:m.act.length,bud:m.act.reduce((s,x)=>s+(+x.b||0),0),tgt:tl?m.tsev+m.tfrq:"",tgtL:tl?tl.n:""}}
function summary(){
  const r=D.acts.filter(a=>it(a.id).app).map(rowData);
  if(!r.length)return '<div class="card empty">No activities selected yet. Tick some on the Activities tab.</div>';
  const body=r.map(x=>`<tr><td>${x.id}</td><td>${esc(x.name)}</td><td>${badge(x.cur[0]||"",x.cur[1]||"")}</td><td>${x.strat}</td><td>${x.ofi}</td><td>${x.n}</td><td>${x.bud}</td><td>${badge(x.tgt[0]||"",x.tgt[1]||"")}</td></tr>`).join("");
  return `<div class="card wrap"><table><tr><th>No.</th><th>Activity</th><th>Current risk</th><th>Strategy</th><th>OFIs</th><th>Actions</th><th>Budget (INR lakh)</th><th>Proposed risk</th></tr>${body}
  <tr><th colspan="6">Total budget</th><th>${r.reduce((s,x)=>s+x.bud,0).toFixed(1)}</th><th></th></tr></table></div>`;
}

// ---- Download / load / reset ----
function dl(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()}
function exportCSV(){
  const h=["No","Activity","Current risk","Level","Strategy","OFIs","Actions","Budget (INR lakh)","Proposed risk","Proposed level"];
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const rows=D.acts.filter(a=>it(a.id).app).map(rowData).map(x=>[x.id,x.name,x.cur,x.curL,x.strat,x.ofi,x.n,x.bud,x.tgt,x.tgtL].map(q).join(","));
  dl("risk_summary.csv",[h.map(q).join(","),...rows].join("\n"),"text/csv");
}
const exportJSON=()=>dl("risk_backup.json",JSON.stringify(S,null,1),"application/json");
function loadJSON(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
